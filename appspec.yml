version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/app   # or any directory you want on EC2

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/start_container.sh
      timeout: 300
      runas: root
