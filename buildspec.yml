version: 0.2

env:
  parameter-store:
    DOCKER_REGISTRY_USERNAME: /myapp/docker-credentials/docker_username
    DOCKER_REGISTRY_PASSWORD: /myapp/docker-credentials/docker_password
    DOCKER_REGISTRY_URL: /myapp/docker-credentials/docker_registry_url

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - echo "Installing dependencies..."
      - pip install -r day-14/simple-python-app/requirements.txt

  build:
    commands:
      - echo "Logging in to Docker registry..."
      - echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USERNAME" --password-stdin docker.io
      - echo "Building Docker image..."
      - docker build -t docker.io/himachanddocker/simple-pythons-flask-app:latest day-14/simple-python-app/
      - echo "Pushing Docker image..."
      - docker push docker.io/himachanddocker/simple-pythons-flask-app:latest

post_build:
  commands:
    - echo "Build completed successfully!"

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - day-14/simple-python-app/**/*
